name: Extract ZIP Project

on:
  push:
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP file
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Found: $ZIP_FILE"

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Detect project root
        run: |
          shopt -s dotglob nullglob

          entries=(extracted/*)

          if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
            echo "ZIP contains one root folder: ${entries[0]}"
            echo "PROJECT_ROOT=${entries[0]}" >> "$GITHUB_ENV"
          else
            echo "ZIP contains files directly."
            echo "PROJECT_ROOT=extracted" >> "$GITHUB_ENV"
          fi

      - name: Copy project files
        run: |
          mkdir -p .github/workflows

          rsync -a \
            --exclude='.github/workflows/' \
            "$PROJECT_ROOT"/ ./

      - name: Remove ZIP
        run: |
          rm -f "$ZIP_FILE"
          rm -rf extracted

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract project from ZIP"
          git push
