name: Build and Release Ana Muslim APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install required Android SDK components
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager | head -n1)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Read version from version.properties
        id: ver
        run: |
          set -e
          CODE=$(grep '^VERSION_CODE=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          NAME=$(grep '^VERSION_NAME=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "سيتم بناء الإصدار: versionCode=$CODE  versionName=$NAME"

      - name: Decode release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Locate and rename APK
        id: apk
        run: |
          set -e
          SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          if [ -z "$SRC" ]; then
            echo "لم يتم العثور على ملف APK الناتج!" >&2
            exit 1
          fi
          mkdir -p release_out
          cp "$SRC" release_out/app-release.apk
          SIZE=$(stat -c%s release_out/app-release.apk)
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      # ====================================================================
      # دعم اختياري وغير مُفعَّل تلقائياً لفصل "مستودع المصدر" (يمكن جعله Private
      # لاحقاً لإخفاء الكود الحقيقي بالكامل) عن "مستودع الإصدارات العامة" (يبقى
      # Public لأن التطبيق المثبَّت لدى المستخدمين يحتاج تنزيل version.json وملف
      # APK منه دون تسجيل دخول). طالما لم تُضيفوا السرّين أدناه، لا شيء يتغيّر
      # إطلاقاً عن السلوك الحالي — هذا البناء سيستمر بالنشر لنفس هذا المستودع
      # بالضبط كما يعمل الآن. فقط إن قررتم لاحقاً تفعيل الفصل (راجع شرح ذلك في
      # ملخص التعديلات المُرسَل لكم)، أضيفوا:
      #   RELEASES_REPO        = اسم مستودع الإصدارات العام، مثلاً owner/ana-muslim-releases
      #   RELEASES_REPO_TOKEN  = Personal Access Token صلاحيته contents:write على ذلك المستودع فقط
      # ====================================================================
      - name: Determine releases target repo (defaults to this same repo)
        id: releases_target
        env:
          HAS_SPLIT_REPO: ${{ secrets.RELEASES_REPO != '' && secrets.RELEASES_REPO_TOKEN != '' }}
        run: |
          if [ "$HAS_SPLIT_REPO" = "true" ]; then
            echo "repo=${{ secrets.RELEASES_REPO }}" >> "$GITHUB_OUTPUT"
            echo "using_split_repo=true" >> "$GITHUB_OUTPUT"
            echo "سيُنشر هذا الإصدار إلى مستودع الإصدارات المنفصل: ${{ secrets.RELEASES_REPO }}"
          else
            echo "repo=${{ github.repository }}" >> "$GITHUB_OUTPUT"
            echo "using_split_repo=false" >> "$GITHUB_OUTPUT"
            echo "لم يُفعَّل الفصل بعد؛ سيُنشر هذا الإصدار إلى نفس هذا المستودع كما هو الحال الآن."
          fi

      - name: Generate version.json
        run: |
          cat > release_out/version.json << EOF
          {
            "versionCode": ${{ steps.ver.outputs.code }},
            "versionName": "${{ steps.ver.outputs.name }}",
            "apkUrl": "https://github.com/${{ steps.releases_target.outputs.repo }}/releases/download/latest/app-release.apk",
            "apkSizeBytes": ${{ steps.apk.outputs.size }},
            "releaseNotes": ""
          }
          EOF
          cat release_out/version.json

      - name: Publish/replace the "latest" GitHub Release
        env:
          GH_TOKEN: ${{ steps.releases_target.outputs.using_split_repo == 'true' && secrets.RELEASES_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ steps.releases_target.outputs.repo }}
        run: |
          set -e
          if gh release view latest --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release delete latest --repo "$TARGET_REPO" --yes --cleanup-tag
          fi
          gh release create latest \
            --repo "$TARGET_REPO" \
            --title "أنا مسلم - v${{ steps.ver.outputs.name }}" \
            --notes "إصدار تلقائي رقم ${{ steps.ver.outputs.code }} (${{ steps.ver.outputs.name }})" \
            release_out/app-release.apk release_out/version.json

      - name: Clean up keystore from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
