# Bump these two values every time you want to publish an update, then
# commit. GitHub Actions (.github/workflows/release.yml) does everything
# else automatically: builds a signed release APK, generates version.json,
# and publishes both as a GitHub Release that every installed copy of the
# app checks against on launch.
#
# versionCode MUST increase by at least 1 every single release, and must
# NEVER go backwards — this is the number the update system actually
# compares. versionName is just the human-readable label shown to players.
versionCode=22
versionName=2.2
