# إعدادات مشروع Gradle لتطبيق "أنا مسلم"

# ذاكرة كافية لتفادي أي بطء أو فشل أثناء البناء على أجهزة GitHub Actions
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# تفعيل AndroidX إجبارياً (كل مكتبات المشروع الحديثة تعتمد عليه)
android.useAndroidX=true

# عدم توليد مكتبات Jetifier القديمة (كل الاعتماديات هنا AndroidX أصلاً فلا حاجة له،
# وتعطيله يسرّع البناء)
android.enableJetifier=false

# تفعيل التوازي بين الوحدات وتفعيل التخزين المؤقت لتسريع البناء على GitHub Actions
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# استخدام Kotlin بنمط الكود الرسمي
kotlin.code.style=official
